name: records-skills 시험

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 의존 패키지
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pypdf pikepdf pillow numpy
      - name: HWPX 패키지(3.12만)
        if: matrix.python == '3.12'
        run: python -m pip install python-hwpx
      - name: 문법 검사
        run: python -m compileall -q plugins/records-skills
      - name: 매니페스트 JSON 검사
        run: |
          python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['.claude-plugin/marketplace.json', 'plugins/records-skills/.claude-plugin/plugin.json', 'plugins/records-skills/hooks/hooks.json']]; print('JSON 3개 정상')"
      - name: 시험
        run: python plugins/records-skills/tests/run_tests.py
