name: records-skills 시험

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 의존 패키지
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pypdf pikepdf pillow numpy
      - name: HWPX 패키지(3.12만)
        if: matrix.python == '3.12'
        run: python -m pip install "python-hwpx<7"
      - name: LibreOffice(보존포맷 변환 시험 — 3.12에서만)
        if: matrix.python == '3.12'
        # 실행기 패키지 저장소가 가끔 멈춤 — 한 번에 10분까지, 넘으면 한 번 더
        run: |
          inst() { timeout 600 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-calc'; }
          inst || { echo "다시 시도"; sleep 20; inst; }
      - name: 문법 검사
        run: python -m compileall -q plugins/records-skills
      - name: 매니페스트 JSON 검사
        run: |
          python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['.claude-plugin/marketplace.json', 'plugins/records-skills/.claude-plugin/plugin.json', 'plugins/records-skills/hooks/hooks.json']]; print('JSON 3개 정상')"
      - name: 시험
        env:
          RECORDS_SOFFICE_ELSEWHERE: ${{ matrix.python != '3.12' && 'Python 3.12 실행기' || '' }}
        run: python plugins/records-skills/tests/run_tests.py
